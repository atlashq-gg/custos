# The NATS server configuration of the event path (optio/docs/producers.md).
#
# Each user reads its password from an environment variable of the NATS server. A user can only
# do what its permissions permit: a subject that no "allow" list names is refused. The quoted
# subjects are literal: NATS replaces a $NAME only when it has no quotes.
#
# Optio creates the stream at its start. This file defines only JetStream and the users.

port: 4222

jetstream {
  store_dir: /data
}

authorization {
  users = [
    # The producer custos (the server). It publishes the events of its source and reads only the
    # acknowledgements of the broker on its own reply subjects.
    {
      user: custos
      password: $CUSTOS_PASSWORD
      permissions: {
        publish: { allow: ["events.custos.>"] }
        subscribe: { allow: ["_INBOX.custos.>"] }
      }
    }
    # Optio. It creates and reads the stream OPTIO through the JetStream API, and publishes no
    # event. It publishes the query messages, and creates and uses the buckets of the queries.
    {
      user: optio
      password: $OPTIO_PASSWORD
      permissions: {
        publish: {
          allow: [
            "$JS.API.STREAM.CREATE.OPTIO"
            "$JS.API.STREAM.UPDATE.OPTIO"
            "$JS.API.STREAM.INFO.OPTIO"
            "$JS.API.CONSUMER.CREATE.OPTIO.>"
            "$JS.API.CONSUMER.DELETE.OPTIO.>"
            "$JS.API.CONSUMER.MSG.NEXT.OPTIO.>"
            "queries.>"
            "$JS.API.STREAM.CREATE.KV_OPTIO_QUERIES"
            "$JS.API.STREAM.UPDATE.KV_OPTIO_QUERIES"
            "$JS.API.STREAM.INFO.KV_OPTIO_QUERIES"
            "$JS.API.DIRECT.GET.KV_OPTIO_QUERIES"
            "$JS.API.CONSUMER.CREATE.KV_OPTIO_QUERIES.>"
            "$JS.API.CONSUMER.DELETE.KV_OPTIO_QUERIES.>"
            "$KV.OPTIO_QUERIES.>"
            "$JS.API.STREAM.CREATE.KV_OPTIO_CONVERSATIONS"
            "$JS.API.STREAM.UPDATE.KV_OPTIO_CONVERSATIONS"
            "$JS.API.DIRECT.GET.KV_OPTIO_CONVERSATIONS"
            "$KV.OPTIO_CONVERSATIONS.>"
          ]
        }
        subscribe: { allow: ["_INBOX.optio.>"] }
      }
    }
  ]
}
