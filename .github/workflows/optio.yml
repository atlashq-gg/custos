name: optio

# Tests optio and builds its container image ghcr.io/atlashq-gg/custos-optio.
#
#   pull request          -> build the image, no push
#   push to main          -> push the tags unstable and sha-<sha>, version "unstable+<short sha>"
#   push of optio-X.Y.Z   -> push the tags X.Y.Z and X.Y, version "X.Y.Z"
#
# GitHub does not apply the paths filter to a tag push, so each optio-* tag runs this workflow.
# The AppHost builds the server, and the tests read the realm file of the server, so a change in
# server/ runs this workflow too.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths: ["optio/**", "spec/**", "server/**", ".github/workflows/optio.yml"]
  push:
    branches: [main]
    tags: ["optio-[0-9]+.[0-9]+.[0-9]+"]
    paths: ["optio/**", "spec/**", "server/**", ".github/workflows/optio.yml"]

# One run for each ref at a time, so two pushes to main cannot race on the tag unstable. A new
# push to a pull request cancels the run in progress for it. Closing or merging the pull request
# does the same: the run for the event "closed" cancels the run in progress, and skips its jobs.
concurrency:
  group: optio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: optio

jobs:
  build-and-test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: optio/global.json

      - run: dotnet restore Optio.slnx

      # CSharpier wraps code at 100 characters. It does not wrap comments and strings, so a second
      # check finds those lines.
      - name: Check the format
        run: |
          dotnet tool restore
          dotnet csharpier check .
          long=$(find . -name '*.cs' -not -path '*/obj/*' -not -path '*/bin/*' \
            -not -name '*.Designer.cs' -not -name '*ModelSnapshot.cs' \
            -exec awk 'length > 100 { print FILENAME ":" FNR }' {} +)
          if [ -n "$long" ]; then echo "Lines over 100 characters:"; echo "$long"; exit 1; fi
      - run: dotnet build Optio.slnx --configuration Release --no-restore
      # The tests in the category Discord connect to Discord with a bot token. CI has no token.
      # The tests in the category Feasibility examine the broker for about 2 minutes. Run them when
      # the broker or its client changes. The tests in the category Model call the model provider
      # with a key. CI has no key.
      - run: >
          dotnet test Optio.slnx --configuration Release --no-build
          --filter "TestCategory!=Discord&TestCategory!=Feasibility&TestCategory!=Model"
          --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: optio-test-results
          path: optio/TestResults/**/*.trx
          retention-days: 14

  image:
    # No image is published without a green test suite.
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/optio-* ]]; then
            semver="${GITHUB_REF#refs/tags/optio-}"
            if ! grep -qx "## ${semver}" CHANGELOG.md; then
              echo "optio/CHANGELOG.md has no section ## ${semver}."
              exit 1
            fi
            printf 'semver=%s\nversion=%s\nassembly=%s\n' "$semver" "$semver" "$semver" \
              >> "$GITHUB_OUTPUT"
          else
            # AssemblyVersion must be numeric. Only the informational version can hold "unstable".
            printf 'version=unstable+%s\nassembly=0.0.0\n' "${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/custos-optio
          flavor: latest=false
          # The tag has the prefix optio-, so the semver entries get the version from the value.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.semver }},enable=${{ startsWith(github.ref, 'refs/tags/optio-') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.semver }},enable=${{ startsWith(github.ref, 'refs/tags/optio-') }}
            type=raw,value=unstable,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=long,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr
          # The action derives the version from the first tag and the license from the repository
          # (MIT). These labels override both, so that the image matches the app and the Dockerfile.
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: optio
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_REPO=${{ github.server_url }}/${{ github.repository }}
            REVISION=${{ github.sha }}
            VERSION=${{ steps.version.outputs.version }}
            ASSEMBLY_VERSION=${{ steps.version.outputs.assembly }}
          cache-from: type=gha,scope=custos-optio
          cache-to: type=gha,scope=custos-optio,mode=max

  release:
    # A GitHub release for a tag optio-X.Y.Z, after the image is published. Its description is the
    # section of the version in optio/CHANGELOG.md.
    needs: image
    if: startsWith(github.ref, 'refs/tags/optio-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Write the release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#optio-}"
          notes="$RUNNER_TEMP/release-notes.md"
          ../.github/scripts/release-notes.sh CHANGELOG.md "$version" "$notes"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/custos-optio:${version}"
          printf '\nImage: `%s`\n' "$image" >> "$notes"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          name: optio ${{ steps.notes.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          # The latest release stays the one of Custos, the application that users download.
          make_latest: false
