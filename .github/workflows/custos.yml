name: custos

on:
  pull_request:
    paths: ["custos/**", "spec/**", ".github/workflows/custos.yml"]
  push:
    branches: [main]
    paths: ["custos/**", "spec/**", ".github/workflows/custos.yml"]

defaults:
  run:
    working-directory: custos

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install the Tauri libraries
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: custos

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The first Windows build. The MSVC toolchain is the default of rustup on this runner.
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: custos

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

      # The user must not need the Visual C++ Redistributable (see custos/.cargo/config.toml).
      - name: Make sure that custos.exe needs no Visual C++ runtime DLL
        shell: pwsh
        run: |
          cargo build -p custos-app --locked
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $dependents = & $dumpbin.FullName /dependents target\debug\custos.exe
          $dependents
          if ($dependents -match 'VCRUNTIME|MSVCP') {
            Write-Error "custos.exe needs the Visual C++ runtime."
            exit 1
          }
