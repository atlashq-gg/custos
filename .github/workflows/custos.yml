name: custos

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths: ["custos/**", "spec/**", ".github/workflows/custos.yml"]
  push:
    branches: [main]
    paths: ["custos/**", "spec/**", ".github/workflows/custos.yml"]

# A new push to a pull request cancels the run in progress for it. Closing or merging the pull
# request does the same: the run for the event "closed" cancels the run in progress, and skips its
# jobs. A push gets its own group, so it never cancels.
concurrency:
  group: custos-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: custos

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install the Tauri libraries
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libgtk-layer-shell-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: custos

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The installer script of the Linux release, with a fake AppImage. The release workflow tests it
  # with the real AppImage.
  installer-script:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck packaging/*.sh
      - run: sh packaging/test-install.sh

  # The first Windows build. The MSVC toolchain is the default of rustup on this runner.
  windows:
    if: github.event.action != 'closed'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: custos

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

      # The user must not need the Visual C++ Redistributable (see custos/.cargo/config.toml).
      - name: Make sure that custos.exe needs no Visual C++ runtime DLL
        shell: pwsh
        run: |
          cargo build -p custos-app --locked
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $dependents = & $dumpbin.FullName /dependents target\debug\custos.exe
          $dependents
          if ($dependents -match 'VCRUNTIME|MSVCP') {
            Write-Error "custos.exe needs the Visual C++ runtime."
            exit 1
          }
