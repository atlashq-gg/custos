name: release-custos

# Builds the AppImage for a tag custos/vX.Y.Z and attaches it to a GitHub release. The description
# of the release is the section of the version in custos/CHANGELOG.md.
on:
  push:
    tags: ["custos/v*"]

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install the Tauri libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: custos

      - name: Check the version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#custos/v}"
          version=$(grep -m1 '^version' custos/Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$version" ]; then
            echo "The tag $tag is not the version $version in custos/Cargo.toml."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The release description is the section of the version in custos/CHANGELOG.md. A missing
      # section stops the release before the build.
      - name: Extract the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## $VERSION" \
            '$0 == heading { found = 1; next } found && /^## / { exit } found' \
            custos/CHANGELOG.md | sed '/./,$!d' > "$notes"
          if [ ! -s "$notes" ]; then
            echo "custos/CHANGELOG.md has no section ## $VERSION."
            exit 1
          fi

      - run: cargo install tauri-cli --version "^2" --locked

      - name: Build the AppImage
        working-directory: custos/crates/custos-app
        run: cargo tauri build --bundles appimage

      - uses: softprops/action-gh-release@v3
        with:
          name: Custos ${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: custos/target/release/bundle/appimage/*.AppImage
