[package]
name = "custos-app"
description = "The tray application of Custos."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "custos"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
custos-core = { version = "0.1.0", path = "../custos-core" }
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tokio = { version = "1.54.1", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# The overlay defect test (examples/overlay-test.rs).
[target.'cfg(target_os = "linux")'.dev-dependencies]
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }

[build-dependencies]
tauri-build = "2"
