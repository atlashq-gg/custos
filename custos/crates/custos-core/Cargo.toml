[package]
name = "custos-core"
description = "The engine of Custos: configuration, discovery, login, save-file location, and upload."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
hex = "0.4.3"
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust"] }
notify = "8"
rand = "0.10.4"
reqwest = { version = "0.13.5", features = ["form", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync", "fs"] }
toml = "1.2.1"
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
