[workspace]
resolver = "3"
members = ["crates/custos-core", "crates/custos-app"]

[workspace.package]
version = "0.3.0-alpha.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/atlashq-gg/custos"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
